##### General #####

# Use Vim keys in copy mode
set -g mode-keys vi

# Mouse scrolling, pane selection and window selection
set -g mouse on

# Keep more terminal output available for scrolling/searching
set -g history-limit 100000

# Make Escape feel faster in Vim/Neovim
set -sg escape-time 10

# Let applications such as Neovim detect terminal focus changes
set -g focus-events on


##### Window and pane numbering #####

# Start window numbers from 1 instead of 0
set -g base-index 1

# Start pane numbers from 1 instead of 0
setw -g pane-base-index 1

# Remove gaps in window numbering after closing a window
set -g renumber-windows on


##### Clipboard / copy mode #####

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"


##### Pane navigation #####

# Vim-style pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Prefix + Shift-H/J/K/L
# The -r means the key can be repeated without pressing Prefix again
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### Configuration #####

# Reload this file with Prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

##### Status bar #####

set -g status-interval 5
set -g status-left-length 30
set -g status-left '#S '
set -g status-right '#H  %Y-%m-%d %H:%M'

#### Sync panes ####

# This allows to send the same input into all open panes, the possibilities are crazy
bind S setw synchronize-panes \; display-message "Synchronize panes: #{?pane_synchronized,on,off}"
