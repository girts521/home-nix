[general]
# 20 real FFT bands feed the expanded visualizer; the mini display samples six.
bars = 20
framerate = 30
# Keep a stable gain so quiet tracks still show their changing spectrum.
autosens = 0
sensitivity = 1000
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
# On MasterPC, PipeWire's PulseAudio compatibility server is the default source.
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 0.77
